<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimee 的自我介紹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #070f1f;
      --navy-900: #0b1a33;
      --navy-800: #11254a;
      --navy-700: #1a3463;
      --gold: #c9a24d;
      --gold-light: #e6c97a;
      --gold-soft: rgba(201, 162, 77, 0.35);
      --ivory: #f5f1e6;
      --muted: #9aa8c2;
      --line: rgba(201, 162, 77, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      color: var(--ivory);
      background-color: var(--navy-950);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(26, 52, 99, 0.65) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 100%, rgba(201, 162, 77, 0.10) 0%, transparent 50%),
        linear-gradient(160deg, var(--navy-900) 0%, var(--navy-950) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 100%);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 56px 44px 44px;
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(230, 201, 122, 0.12);
      text-align: center;
      animation: rise 0.8s ease-out both;
    }

    /* gold top rule */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* inner hairline frame */
    .card::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(201, 162, 77, 0.12);
      border-radius: 3px;
      pointer-events: none;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 108px;
      height: 108px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, var(--navy-700), var(--navy-950));
      display: grid;
      place-items: center;
      color: var(--gold-light);
      font-family: "Cormorant Garamond", serif;
      font-size: 54px;
      font-weight: 700;
      border: 2px solid var(--gold);
      box-shadow:
        0 0 0 6px var(--navy-800),
        0 0 0 7px var(--gold-soft),
        0 14px 30px rgba(0, 0, 0, 0.4);
    }

    .hello {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.32em;
      color: var(--gold);
      text-transform: uppercase;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 62px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.02em;
      margin: 8px 0 12px;
      color: var(--ivory);
    }

    /* ornamental divider under name */
    h1::after {
      content: "";
      display: block;
      width: 64px;
      height: 1px;
      margin: 20px auto 32px;
      background: var(--gold);
      box-shadow: 0 0 0 0 transparent;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.3em;
      margin-bottom: 18px;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .interests {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 40px;
    }

    .interest {
      background: rgba(7, 15, 31, 0.45);
      border: 1px solid rgba(154, 168, 194, 0.18);
      border-radius: 4px;
      padding: 22px 12px;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .interest:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--gold-soft);
    }

    .interest .emoji { font-size: 32px; display: block; margin-bottom: 10px; }
    .interest .label {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ivory);
    }

    .motto {
      position: relative;
      padding: 30px 24px 26px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .motto p {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--gold-light);
    }

    .motto::before {
      content: "“";
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 12px;
      background: var(--navy-900);
      font-family: "Cormorant Garamond", serif;
      font-size: 60px;
      color: var(--gold);
      line-height: 1;
    }

    @media (max-width: 480px) {
      .card { padding: 46px 22px 32px; }
      h1 { font-size: 48px; }
      .motto p { font-size: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .interest { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">A</div>
    <p class="hello">Hi, I'm</p>
    <h1>Aimee</h1>

    <p class="section-title">我的興趣</p>
    <div class="interests">
      <div class="interest">
        <span class="emoji">✈️</span>
        <span class="label">旅遊</span>
      </div>
      <div class="interest">
        <span class="emoji">📚</span>
        <span class="label">看小說</span>
      </div>
    </div>

    <div class="motto">
      <p>Work hard, play hard.</p>
    </div>
  </main>
</body>
</html>
